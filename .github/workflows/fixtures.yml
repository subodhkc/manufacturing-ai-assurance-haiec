name: Deterministic manufacturing fixtures
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check:fixtures
      - run: node scripts/generate-source-native-v3.cjs --check
      - run: node scripts/generate-source-native-v3-1.cjs --check
      - run: node scripts/build-scenario-shared.cjs --check
      - run: node scripts/build-supporting-report.cjs --check
      - run: node scripts/build-factory-data.cjs --check
      - name: Ensure no generated files drift
        run: git diff --exit-code -- data/generated
