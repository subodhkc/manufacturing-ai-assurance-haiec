<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAIEC · Example Manufacturing Company · Guided Manufacturing Assurance v7.2</title>
<style>
:root{
  --paper:#f3f4f2;--surface:#fff;--canvas:#fafbfa;--ink:#141d22;--ink2:#2a3740;
  --muted:#5d6c75;--muted2:#8695a0;--nav:#141c22;--nav2:#22303a;
  --line:#e2e6e5;--line2:#cfd6d5;
  --accent:#255e63;--accent2:#1a4549;
  --green:#14855f;--greenbg:#e6f5ee;--greenline:#b9dfcd;
  --amber:#8f651a;--amberbg:#fff4dc;--amberline:#eedbab;
  --red:#ab4238;--redbg:#fcebe7;--redline:#efc8bf;
  --blue:#2f6ba0;--bluebg:#eaf2fb;--blueline:#c9dcf1;
  --violet:#6550a4;--violetbg:#f1edfa;--violetline:#d5cbf0;
  --shadow:0 1px 2px rgba(20,29,34,.04),0 12px 32px -12px rgba(20,29,34,.08);
  --shadow2:0 8px 40px -12px rgba(20,29,34,.14);
  --r:10px;--r2:14px;
  --sans:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:var(--paper);font-family:var(--sans);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1{font-size:clamp(26px,2.6vw,38px);line-height:1.14;letter-spacing:-1.1px;font-weight:750}
h2{font-size:19px;letter-spacing:-.4px;line-height:1.3;font-weight:750}
h3{font-size:14.5px;font-weight:750;letter-spacing:-.1px}
h4{font-size:12px;font-weight:750;letter-spacing:.2px}
a{color:#1b5e6b;text-decoration:none;transition:opacity .15s}
a:hover{text-decoration:underline}
code,pre,.mono{font-family:var(--mono)}
code{background:#edf1f1;padding:2px 5px;border-radius:3px;font-size:11px;color:var(--ink2)}
pre{background:#0f1a1f;color:#d0e5e4;padding:14px 16px;border-radius:9px;font-size:11px;line-height:1.7;overflow:auto;white-space:pre-wrap;word-break:break-word}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
button:disabled{opacity:.5;cursor:not-allowed}
::selection{background:var(--accent);color:#fff}

/* App shell */
.app{display:flex;min-height:100vh}
.sidebar{width:250px;flex:0 0 250px;background:var(--nav);color:#d4e0e5;position:sticky;top:0;height:100vh;padding:22px 12px;display:flex;flex-direction:column;overflow:auto;z-index:30}
.logo-row{display:flex;gap:11px;align-items:center;padding:4px 10px 22px;border-bottom:1px solid #2c3a44;margin-bottom:16px}
.logo-mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,#a8e5d8,#5bb3a2);display:grid;place-items:center;color:#0c2a26;font-size:22px;font-weight:900;letter-spacing:-1.4px}
.brand strong{font-size:16.5px;letter-spacing:2px;color:#fff;font-weight:800}
.brand small{display:block;font-size:9.5px;color:#8fa4ae;text-transform:uppercase;letter-spacing:.85px;margin-top:2px}
.navgroup{margin:14px 0 5px;color:#7c95a0;text-transform:uppercase;font-size:9.5px;letter-spacing:1.5px;font-weight:800;padding:0 12px}
.navbtn{width:100%;display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:8px;color:#b5c5cd;font-weight:650;font-size:12.5px;text-align:left;transition:background .12s,color .12s;margin:1px 0}
.navbtn:hover{background:#22343e;color:#fff}
.navbtn.active{background:#2a4f52;color:#fff;box-shadow:inset 3px 0 #7fcbb8}
.navbtn .ic{width:20px;height:20px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.05);border-radius:5px;font-size:10px;font-weight:900;color:#8fa8b3;letter-spacing:.2px}
.navbtn.active .ic{background:#4a8a7e;color:#fff}
.navbtn .cnt{margin-left:auto;background:#5d4630;color:#ffdda3;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:750}
.sidefoot{margin-top:auto;border-top:1px solid #2c3a44;padding:14px 11px 4px;font-size:10.5px;color:#93a7b1;line-height:1.6}
.sidefoot b{display:block;color:#dfe9eb;margin-bottom:4px;font-size:11px}

.workspace{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:25;background:#fff;border-bottom:1px solid var(--line);padding:12px 28px;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:9px;color:#5b6c77;font-size:12.5px;flex-wrap:wrap}
.crumb strong{color:var(--ink);font-weight:750}
.crumb .sep{color:var(--line2)}
.topactions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.page{padding:26px 28px 80px;max-width:1620px;margin:auto;position:relative}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--ink2);font-weight:700;font-size:12.5px;transition:background .12s,border-color .12s,transform .06s;justify-content:center;text-decoration:none;line-height:1.2}
.btn:hover{background:#f3f6f5;border-color:#b0bdc0;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.go:hover{background:#0f7250}
.btn.hold{background:var(--redbg);border-color:var(--redline);color:var(--red)}
.btn.hold:hover{background:#fad9d3}
.btn.warn{background:var(--amberbg);border-color:var(--amberline);color:var(--amber)}
.btn.violet{background:var(--violetbg);border-color:var(--violetline);color:var(--violet)}
.btn.sm{padding:5px 9px;font-size:11.5px}
.btn.xs{padding:3px 8px;font-size:11px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:rgba(0,0,0,.04)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;font-size:10.5px;font-weight:750;letter-spacing:.15px;border:1px solid var(--line2);background:#f5f7f7;color:var(--muted);white-space:nowrap}
.badge.go{background:var(--greenbg);border-color:var(--greenline);color:var(--green)}
.badge.hold{background:var(--redbg);border-color:var(--redline);color:var(--red)}
.badge.warn{background:var(--amberbg);border-color:var(--amberline);color:var(--amber)}
.badge.info{background:var(--bluebg);border-color:var(--blueline);color:var(--blue)}
.badge.violet{background:var(--violetbg);border-color:var(--violetline);color:var(--violet)}
.badge.dark{background:var(--nav2);border-color:var(--nav2);color:#e9f2ef}

/* Cards & layout */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:20px;box-shadow:var(--shadow);min-width:0;transition:box-shadow .2s,border-color .2s}
.card:hover{box-shadow:var(--shadow2)}
.card.tight{padding:14px}
.card.flush{padding:0;overflow:hidden}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cardhead h2{font-size:16.5px}
.cardhead p{font-size:11.5px;color:var(--muted);margin-top:2px;max-width:700px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.span2{grid-column:span 2}
.span3{grid-column:span 3}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row.start{align-items:flex-start}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:11px}
.flex{display:flex;gap:10px;align-items:center}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.small{font-size:11.5px;color:var(--muted)}
.label{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;font-weight:800;color:var(--muted2)}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:1.6px;font-weight:850;color:var(--accent);margin-bottom:8px}
.hr{height:1px;background:var(--line);border:0;margin:14px 0}
.gap8{height:8px}.gap14{height:14px}.gap20{height:20px}
.top10{margin-top:10px}.top14{margin-top:14px}.top20{margin-top:20px}

/* Hero */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.hero-main{max-width:920px}
.hero h1{margin-bottom:10px}
.hero .subtitle{color:var(--muted);font-size:13.5px;max-width:820px;line-height:1.6}

/* Tooltip system */
.tip{position:relative;border-bottom:1px dotted #8fa3ab;cursor:help}
.tip:hover::after,.tip:focus::after{
  content:attr(data-tip);
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#17242a;color:#e7f0ee;padding:8px 11px;border-radius:7px;
  font-size:11px;line-height:1.5;font-weight:500;letter-spacing:0;
  white-space:normal;width:max-content;max-width:280px;z-index:50;
  box-shadow:0 8px 24px rgba(0,0,0,.22);text-transform:none;
  pointer-events:none;animation:tipIn .15s ease
}
.tip:hover::before,.tip:focus::before{
  content:"";position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:#17242a;z-index:51;pointer-events:none
}
@keyframes tipIn{from{opacity:0;transform:translateX(-50%) translateY(4px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Metric */
.metric{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px 15px;position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s}
.metric:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.metric::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--blue)}
.metric.go::before{background:var(--green)}
.metric.warn::before{background:var(--amber)}
.metric.hold::before{background:var(--red)}
.metric .mh{font-size:11px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.metric .num{font-size:32px;font-weight:760;letter-spacing:-1.4px;line-height:1;font-variant-numeric:tabular-nums}
.metric.hold .num{color:var(--red)}
.metric.go .num{color:var(--green)}
.metric .mt{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.metric .delta{font-size:10.5px;font-weight:750;padding:2px 6px;border-radius:5px;margin-left:auto}
.metric .delta.up{background:var(--greenbg);color:var(--green)}
.metric .delta.dn{background:var(--redbg);color:var(--red)}
.metric .delta.flat{background:#eef1f1;color:var(--muted)}

/* Insight panel */
.insight{background:linear-gradient(135deg,#152229 0%,#1c2f38 100%);color:#f2f7f6;border-radius:var(--r2);padding:24px 26px;display:flex;justify-content:space-between;align-items:center;gap:18px;border-left:4px solid #d9a860;margin-bottom:18px;flex-wrap:wrap}
.insight h2{color:#fff;font-size:clamp(17px,1.8vw,22px);max-width:900px;line-height:1.28}
.insight p{color:#b9c9cb;margin-top:8px;font-size:12.5px;max-width:820px}

/* Notice */
.notice{padding:13px 15px;border-radius:9px;border:1px solid var(--blueline);background:var(--bluebg);color:#2a4d78;font-size:12.5px;line-height:1.6;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.notice b{display:block;margin-bottom:3px;font-size:12.5px}
.notice p{margin:0;color:inherit;font-size:12.5px}
.notice.go{background:var(--greenbg);border-color:var(--greenline);color:#0f6b4e}
.notice.warn{background:var(--amberbg);border-color:var(--amberline);color:#7a5614}
.notice.hold{background:var(--redbg);border-color:var(--redline);color:#8a3025}
.notice.violet{background:var(--violetbg);border-color:var(--violetline);color:#4d3d86}

/* Tabs */
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:9px 14px;font-size:12.5px;font-weight:650;color:var(--muted2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s,border-color .12s}
.tab:hover{color:var(--ink2)}
.tab.active{color:var(--ink);border-bottom-color:var(--accent)}

/* Table */
.tblwrap{overflow:auto;border-radius:8px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px}
.tbl th{padding:10px 12px;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted2);font-weight:800;border-bottom:1px solid var(--line);background:#f9fbfa;white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid #eef2f1;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover td{background:#fafcfb}
.tbl tr.stripe-red td:first-child{box-shadow:inset 3px 0 var(--red)}
.tbl tr.stripe-warn td:first-child{box-shadow:inset 3px 0 var(--amber)}
.tbl tr.stripe-go td:first-child{box-shadow:inset 3px 0 var(--green)}
.tbl tr.selected td{background:#f0f7f6}

/* Flow */
.flow{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding:4px 1px}
.flow .node{min-width:130px;max-width:180px;flex:1;background:#f1f6f4;border:1px solid #cfe0d9;border-radius:9px;padding:11px 12px;text-align:left}
.flow .node .tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted2);font-weight:800;margin-bottom:4px}
.flow .node b{font-size:11.5px;color:var(--ink);display:block;line-height:1.3}
.flow .node small{font-size:10.5px;color:var(--muted);margin-top:4px;display:block;line-height:1.4}
.flow .node.primary{background:var(--bluebg);border-color:var(--blueline)}
.flow .node.warn{background:var(--amberbg);border-color:var(--amberline)}
.flow .node.hold{background:var(--redbg);border-color:var(--redline)}
.flow .node.go{background:var(--greenbg);border-color:var(--greenline)}
.flow .arw{align-self:center;color:#8ea69c;font-size:15px;font-weight:900;flex:none}

/* List items */
.listitem{padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#fbfcfc;transition:border-color .12s,background .12s;margin-bottom:8px}
.listitem:hover{border-color:var(--line2);background:#fff}
.listitem.red{border-left:3px solid var(--red)}
.listitem.amber{border-left:3px solid var(--amber)}
.listitem.go{border-left:3px solid var(--green)}
.listitem.blue{border-left:3px solid var(--blue)}

/* Inputs */
.input,.select,textarea,input[type=text],input[type=email],input[type=number]{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:7px;background:#fff;color:var(--ink);font-size:12.5px;font-family:inherit;transition:border-color .12s}
.input:focus{border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11px;font-weight:750;color:var(--ink2);letter-spacing:.15px}
.field small{font-size:11px;color:var(--muted2);line-height:1.5}
.fieldrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* Pills */
.pilltabs{display:flex;gap:5px;flex-wrap:wrap}
.pilltabs button{padding:7px 12px;border-radius:8px;background:#f4f6f5;color:var(--muted);border:1px solid var(--line);font-weight:700;font-size:11.5px;transition:all .12s}
.pilltabs button:hover{background:#eaf1ef;color:var(--ink2)}
.pilltabs button.active{background:#dfeeea;border-color:#9fc9b8;color:#144a44}

/* Score bar */
.scorebar{height:9px;background:#e7ebea;border-radius:20px;overflow:hidden;display:flex}
.scorebar b{background:var(--green);height:100%;transition:width .6s cubic-bezier(.16,1,.3,1)}
.scorebar b.amber{background:var(--amber)}
.scorebar b.red{background:var(--red)}

/* Toast */
.toast{position:fixed;right:22px;bottom:22px;background:#17242a;color:#e7f0ee;padding:12px 18px;border-radius:9px;font-size:12.5px;box-shadow:0 12px 36px rgba(0,0,0,.3);z-index:200;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;max-width:420px;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

/* Modal */
.modal-shell{position:fixed;inset:0;background:rgba(15,26,29,.65);z-index:150;display:grid;place-items:center;padding:18px;animation:fadeIn .15s}
.modal{background:#fff;border-radius:13px;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:24px;box-shadow:0 26px 80px rgba(0,0,0,.4)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Reveal animation */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:none}
.stagger > *{opacity:0;transform:translateY(10px);animation:itemIn .5s cubic-bezier(.16,1,.3,1) forwards}
.stagger > *:nth-child(1){animation-delay:.03s}
.stagger > *:nth-child(2){animation-delay:.08s}
.stagger > *:nth-child(3){animation-delay:.13s}
.stagger > *:nth-child(4){animation-delay:.18s}
.stagger > *:nth-child(5){animation-delay:.23s}
.stagger > *:nth-child(6){animation-delay:.28s}
@keyframes itemIn{to{opacity:1;transform:none}}

/* Pulse */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pulse{animation:pulse 2s ease-in-out infinite}

/* Diagram panel */
.diagram{background:#0f1a1f;border-radius:12px;padding:24px;overflow-x:auto;position:relative}
.diagram svg{min-width:900px;width:100%;height:auto;display:block}
.diagram .flow-label{font-family:var(--sans);font-size:12.5px;fill:#e7f0ee;font-weight:600}
.diagram .flow-sub{font-family:var(--mono);font-size:10px;fill:#8fa4ae;letter-spacing:.05em}
.diagram .flow-tag{font-family:var(--mono);font-size:9.5px;fill:#5d7781;letter-spacing:.14em;text-transform:uppercase}

/* Mobile nav */
.mobile-nav{display:none;background:#141c22;padding:9px 12px;gap:6px;overflow-x:auto;position:sticky;top:0;z-index:35}
.mobile-nav button{flex:0 0 auto;background:#22343e;border:1px solid #2e4552;color:#c9d6dd;border-radius:7px;padding:8px 11px;font-size:11px;font-weight:700}
.mobile-nav button.active{background:#3a6862;color:#fff;border-color:#4d8a82}

/* Judge guidance bar */
.judge{background:linear-gradient(135deg,#1a2e34 0%,#244a4c 100%);color:#f2f7f6;border-radius:12px;padding:18px 22px;margin-bottom:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-left:4px solid #d9a860}
.judge .jmain{flex:1;min-width:260px}
.judge h3{color:#fff;font-size:15px;margin-bottom:5px}
.judge p{color:#b8cacb;font-size:12px;line-height:1.55}
.judge .jpill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:5px 11px;font-size:11px;font-weight:700;color:#e7f0ee}

/* HF Provenance timeline */
.hfchain{display:flex;flex-direction:column;gap:0;position:relative}
.hfchain::before{content:"";position:absolute;left:22px;top:14px;bottom:14px;width:2px;background:linear-gradient(180deg,#2f9d80,#ab4238);opacity:.4}
.hfstep{display:grid;grid-template-columns:46px 1fr;gap:16px;padding:12px 0;position:relative}
.hfstep .dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--green);margin-top:6px;justify-self:center;z-index:1}
.hfstep.hold .dot{border-color:var(--red)}
.hfstep.warn .dot{border-color:var(--amber)}
.hfstep b{font-size:12.5px;display:block;margin-bottom:3px}
.hfstep p{font-size:11.5px;color:var(--muted);margin:0;line-height:1.55}

/* Manufacturing icon grid */
.mfg-icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:12px}
.mfg-icon{background:#f7faf9;border:1px solid var(--line);border-radius:10px;padding:14px 10px;text-align:center;transition:transform .25s cubic-bezier(.16,1,.3,1),border-color .12s,background .12s;cursor:default}
.mfg-icon:hover{transform:translateY(-2px);border-color:var(--accent);background:#fff}
.mfg-icon svg{width:32px;height:32px;margin:0 auto 8px;stroke:#2a7078;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mfg-icon .lbl{font-size:10.5px;font-weight:750;color:var(--ink2);line-height:1.3}

function addEvent(o){ const e = { id:'EV-'+String(STATE.events.length+1).padStart(4,'0'), at:now(), status:'info', ...o }; STATE.events.unshift(e); return e; }
function pill(text, kind='default'){ return `<span class="badge ${kind}">${esc(text)}</span>`; }
function statusPill(status){
  if(/BLOCK|Failed|hold|reject/i.test(status)) return pill(status,'hold');
  if(/REVIEW|Under|assessment|pending|Candidate/i.test(status)) return pill(status,'warn');
  if(/MONITOR|Live|go|Verified|Approved/i.test(status)) return pill(status,'go');
  return pill(status,'info');
}
function tip(text, content){ return `<span class="tip" data-tip="${esc(text)}">${content}</span>`; }

function renderCapabilityDiagram(s){
  const rows = s.capabilities.map(c => {
    const status = c.delegated && c.granted && c.exercised ? 'go' : c.granted && !c.delegated ? 'hold' : 'info';
    return `<tr class="stripe-${status === 'hold' ? 'red' : status === 'go' ? 'go' : ''}">
      <td><strong>${esc(c.name)}</strong></td>
      <td>${c.delegated ? '<span class="badge go">Delegated</span>' : '<span class="badge">Not delegated</span>'}</td>
      <td>${c.granted ? '<span class="badge info">Granted</span>' : '<span class="badge">Not granted</span>'}</td>
      <td>${c.exercised ? '<span class="badge go">Exercised</span>' : '<span class="badge">Not observed</span>'}</td>
      <td>${c.granted && !c.delegated ? '<span class="badge hold">Divergence</span>' : c.delegated && c.exercised ? '<span class="badge go">In lane</span>' : '<span class="badge">Informational</span>'}</td>
    </tr>`;
  }).join('');

  return `
    <div class="card">
      <div class="cardhead"><div><h2>Capability diagram</h2><p>What the agent is delegated, what it is granted, and what it has exercised. Divergence between granted and delegated scope is the finding.</p></div></div>
      <div class="tblwrap"><table class="tbl">
        <thead><tr><th>Capability</th><th>Delegated</th><th>Granted</th><th>Exercised</th><th>Disposition</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="notice warn top14">
        <div><b>Why capability diagrams matter</b><p>A capability that is granted but not delegated is a divergence. HAIEC reports it as a finding, not as a violation — the finding drives the review before the action reaches production.</p></div>
      </div>
    </div>`;
}

function renderConstellation(s){
  // Draw a simple constellation SVG per system
  const nodes = s.constellation || [];
  const w = 560, h = 280;
  const svg = nodes.map((n,i) => {
    const cx = n.x, cy = n.y;
    let fill = '#eaf2fb', stroke = '#2f6ba0', label = n.label;
    if(n.type === 'agent'){ fill = '#dfeeea'; stroke = '#257a65'; }
    if(n.type === 'human'){ fill = '#f1edfa'; stroke = '#6550a4'; }
    if(n.type === 'source'){ fill = '#fff4dc'; stroke = '#8f651a'; }
    return `
      <g>
        <circle cx="${cx}" cy="${cy}" r="30" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>
        <text x="${cx}" y="${cy+4}" text-anchor="middle" style="font-family:var(--sans);font-size:9.5px;font-weight:750;fill:${stroke}">${esc(label.substring(0,12))}</text>
        <text x="${cx}" y="${cy+52}" text-anchor="middle" style="font-family:var(--mono);font-size:9px;fill:#7c848d;letter-spacing:.1em;text-transform:uppercase">${esc(n.type)}</text>
      </g>`;
  }).join('');

  // Connect all nodes to the first agent
  const agent = nodes.find(n => n.type === 'agent');
  const lines = agent ? nodes.filter(n => n !== agent).map(n =>
    `<line x1="${agent.x}" y1="${agent.y}" x2="${n.x}" y2="${n.y}" stroke="rgba(37,122,101,.28)" stroke-width="1.4" stroke-dasharray="4 3"/>`
  ).join('') : '';

  return `
    <div class="card">
      <div class="cardhead"><div><h2>AI constellation</h2><p>The agent, its sources, its business systems, and its human approvers — held in one connected view.</p></div></div>
      <div class="diagram">
        <svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
          ${lines}
          ${svg}
        </svg>
      </div>
      <div class="notice info top14">
        <div><b>Reading the constellation</b><p>Green = AI agent · Blue = business system · Amber = source of truth · Violet = accountable human. Every edge is a potential consequence path.</p></div>
      </div>
    </div>`;
}

function runScenario(){
  const sc = scen(STATE.selectedScenario);
  const s = sys(sc.system);
  const input = $('scenario-value');
  if(!input) return;
  const v = Number(input.value);
  if(!Number.isFinite(v) || v < sc.min || v > sc.max){ toast(`Enter a value between ${sc.min} and ${sc.max}.`); return; }
  STATE.simValue = v;

  const c = STATE.config;
  let decision = 'REVIEW_REQUIRED';
  let status = 'pending';
  let explanation = '';
  let effect = 'NONE';
  let requires = false;

  if(STATE.paused[sc.system]){
    decision = 'DENY'; status = 'rejected';
    explanation = 'Agent dispatcher is paused. Request blocked before any business-system effect.';
  } else if(sc.id === 'HOLD'){
    if(v <= c.autoContainMax){
      decision = 'PASS'; status = 'applied';
      explanation = `Within ${c.autoContainMax}-engine automatic containment path. Quality broker applied. Local simulator readback recorded.`;
      STATE.mes.contained += v; effect = 'READBACK_VERIFIED';
    } else if(v <= c.supervisorCeiling){
      decision = 'REVIEW_REQUIRED'; status = 'pending'; requires = true;
      explanation = `${v} engines exceeds automatic containment ceiling of ${c.autoContainMax}. Expanded containment requires Quality Supervisor authorization. Containment is protective; this is not a denial.`;
    } else {
      decision = 'REVIEW_REQUIRED'; status = 'pending'; requires = true;
      explanation = `${v} engines exceeds supervisor ceiling of ${c.supervisorCeiling}. Requires Plant Quality Manager authorization. Containment remains protective.`;
    }
  } else if(sc.id === 'RELEASE'){
    decision = 'DENY'; status = 'rejected';
    explanation = `Release from active containment requires documented Quality disposition. Never auto-approved. Only the Quality Director or Material Review Board can authorize release.`;
  } else if(sc.id === 'MES'){
    decision = 'DENY'; status = 'rejected';
    explanation = 'Direct MES work-order write is prohibited for this agent. Inherited service permission does not confer delegation.';
  } else if(sc.id === 'VISION'){
    if(v > c.visionDrift){ decision = 'REVIEW_REQUIRED'; status = 'pending'; requires = true;
      explanation = `Inspection drift of ${v} exceeds configured ${c.visionDrift} threshold. Revalidation required before automatic disposition.`;
    } else { decision = 'PASS'; status = 'applied'; explanation = `Drift of ${v} is within ${c.visionDrift} threshold. Observation recorded.`; }
  } else if(sc.id === 'FORECAST'){
    if(v > c.forecastMax){ decision = 'REVIEW_REQUIRED'; status = 'pending'; requires = true;
      explanation = `Proposed plan revision of ${v}% exceeds ${c.forecastMax}% policy band. Planner review required before ERP release.`;
    } else { decision = 'PASS'; status = 'applied'; explanation = `Plan revision of ${v}% is within ${c.forecastMax}% band.`; }
  } else if(sc.id === 'PO'){
    if(v > c.poMax){ decision = 'REVIEW_REQUIRED'; status = 'pending'; requires = true;
      explanation = `PO $${fmt(v)} exceeds buyer review cap of $${fmt(c.poMax)}. Buyer decision required.`;
    } else { decision = 'PASS'; status = 'applied'; explanation = `PO $${fmt(v)} inside bounded envelope. Broker applied.`; STATE.mes.poValue += v; effect = 'READBACK_VERIFIED'; }
  } else if(sc.id === 'SUPPLIER'){
    if(v === 0){ decision = 'DENY'; status = 'rejected'; explanation = 'Proposed vendor not on approved master (PPAP status expired). Sourcing cannot bypass Supplier Quality Engineering.'; }
    else { decision = 'PASS'; status = 'applied'; explanation = 'Vendor is on approved master with current PPAP. Recommendation recorded.'; }
  } else if(sc.id === 'MAINT'){
    if(v === 3){ decision = 'REVIEW_REQUIRED'; status = 'pending'; requires = true; explanation = 'Request to stop equipment requires maintenance window authorization. Recommending a stop is not stopping.'; }
    else { decision = 'PASS'; status = 'applied'; explanation = v === 2 ? 'Urgent recommendation recorded. CMMS window authorization required before dispatch.' : 'Normal recommendation recorded.'; }
  } else if(sc.id === 'DELEGATE'){
    if(v === 1){ decision = 'DENY'; status = 'rejected'; explanation = 'Delegated operation exceeds initiator scope. A2A handoff cannot expand authority.'; }
    else { decision = 'PASS'; status = 'applied'; explanation = 'Delegation narrows correctly. Execution still requires its own policy evidence.'; }
  } else if(sc.id === 'SPEND'){
    if(v > c.tokenCap){ decision = 'NOT_SATISFIED'; status = 'review';
      explanation = `Whole-run ${fmt(v)} tokens exceeds frozen cap of ${fmt(c.tokenCap)}. Post-run C16 evaluation. Already-consumed spend is not blocked retroactively.`;
    } else { decision = 'PASS'; status = 'applied'; explanation = `Whole-run ${fmt(v)} tokens within frozen cap of ${fmt(c.tokenCap)}.`; }
  }

  let request = null;
  if(requires){
    request = {
      id:'REV-'+String(STATE.requests.length+1).padStart(4,'0'),
      status:'PENDING', system: s.name, systemId: s.id, scenario: sc.id,
      action: sc.title, target: s.workOrders[0], amount: v, unit: sc.unit,
      policyVersion: STATE.configVersion, createdAt: now(), reason: explanation
    };
    STATE.requests.push(request);
  }

  const ev = addEvent({
    title: `${s.name} — ${decision}`, desc: explanation, system: s.name, systemId: s.id,
    decision, effect, scenario: sc.id, status
  });
  ev.policyVersion = STATE.configVersion;
  ev.requestId = request?.id || null;

  toast(`Outcome: ${decision}`);
  render();
}

function openReview(id){
  const r = STATE.requests.find(x => x.id === id);
  if(!r){ toast('Review not found'); return; }
  if(r.status !== 'PENDING'){ toast('Review already decided'); return; }
  const stale = r.policyVersion !== STATE.configVersion;
  const s = sys(r.systemId);

  const modal = document.createElement('div');
  modal.className = 'modal-shell';
  modal.innerHTML = `<div class="modal">
    <div class="row" style="margin-bottom:16px">
      <div><div class="eyebrow" style="margin-bottom:2px">Exact-action review</div><strong style="font-size:15px">${esc(r.action)}</strong></div>
      <button class="btn xs" data-act="close-modal">Close</button>
    </div>
    <p class="small" style="margin-bottom:16px">${esc(r.reason)}</p>
    ${stale ? `<div class="notice hold" style="margin-bottom:14px"><div><b>Policy changed since request</b><p>Request was made under policy v${r.policyVersion}. Active policy is v${STATE.configVersion}. Original approval cannot be reused.</p></div></div>` : ''}
    <div class="grid g2" style="margin-bottom:16px">
      ${[
        ['Request ID', r.id],
        ['AI system', r.system],
        ['Target', r.target || '—'],
        ['Amount', r.amount + ' ' + r.unit],
        ['Affected serials', s.affectedSerials],
        ['Policy version', 'v' + r.policyVersion]
      ].map(([k,v]) => `<div class="listitem" style="padding:10px 12px"><div class="row"><span class="small muted">${esc(k)}</span><strong>${esc(v)}</strong></div></div>`).join('')}
    </div>
    <div class="field" style="margin-bottom:14px">
      <label>Decision rationale (required)</label>
      <textarea id="decision-note" placeholder="Document the reason for approval or rejection." rows="3"></textarea>
    </div>
    <div class="flex" style="gap:8px;flex-wrap:wrap">
      <button class="btn go" data-act="decide" data-id="${r.id}" data-verdict="APPROVED">Approve exact request</button>
      <button class="btn hold" data-act="decide" data-id="${r.id}" data-verdict="REJECTED">Reject request</button>
      <button class="btn ghost" data-act="close-modal">Cancel</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}
function closeModal(){ document.querySelectorAll('.modal-shell').forEach(el => el.remove()); }
function decide(id, verdict){
  const r = STATE.requests.find(x => x.id === id);
  if(!r || r.status !== 'PENDING'){ toast('Review unavailable'); return; }
  const note = document.getElementById('decision-note')?.value?.trim() || 'Decision recorded.';
  if(r.policyVersion !== STATE.configVersion){
    r.status = 'REJECTED';
    addEvent({ title:'Review blocked — policy changed', desc:`Request ${r.id} made under v${r.policyVersion}. Active v${STATE.configVersion}. Approval cannot be reused.`, system:r.system, systemId:r.systemId, decision:'INVALIDATED_BY_POLICY_CHANGE', effect:'NONE', status:'rejected' });
    closeModal(); render(); return;
  }
  if(verdict === 'REJECTED'){
    r.status = 'REJECTED';
    addEvent({ title:'Request rejected by supervisor', desc:`${r.action} · ${r.amount} ${r.unit}. Rationale: ${note}`, system:r.system, systemId:r.systemId, decision:'REJECTED', effect:'NONE', status:'rejected', scenario:r.scenario });
    toast('Rejected — no effect applied.'); closeModal(); render(); return;
  }
  const permitted = ['REQUEST_HOLD','CREATE_PO','PLAN_CHANGE','QUALITY_DRIFT','PROPOSE_CMMS'];
  if(!permitted.includes(scen(r.scenario).intent)){
    r.status = 'REJECTED';
    addEvent({ title:'Forbidden action remains denied', desc:`Human approval cannot bypass the prohibited-operation envelope. Request ${r.id}.`, system:r.system, systemId:r.systemId, decision:'FORBIDDEN_BY_ENVELOPE', effect:'NONE', status:'rejected' });
    toast('Prohibited operation cannot be approved.'); closeModal(); render(); return;
  }
  r.status = 'APPROVED';
  let effect = 'NONE';
  if(r.scenario === 'HOLD'){ STATE.mes.contained += r.amount; effect = 'READBACK_VERIFIED'; }
  else if(r.scenario === 'PO'){ STATE.mes.poValue += r.amount; effect = 'READBACK_VERIFIED'; }
  else if(r.scenario === 'FORECAST'){ STATE.mes.planChanges += 1; effect = 'READBACK_VERIFIED'; }
  else if(r.scenario === 'VISION'){ STATE.mes.qualityCases += 1; effect = 'READBACK_VERIFIED'; }
  addEvent({ title:'Supervisor approved exact bounded action', desc:`${r.action} · ${r.amount} ${r.unit} · ${r.target}. Rationale: ${note}. Effect: ${effect}.`, system:r.system, systemId:r.systemId, decision:'APPROVED', effect, status:'applied', scenario:r.scenario });
  toast('Approved — effect ' + (effect === 'READBACK_VERIFIED' ? 'verified by readback.' : 'not established.'));
  closeModal(); render();
}

document.addEventListener('click', e => {

  if(nav){ STATE.page = nav.dataset.nav; if(STATE.page === 'system') STATE.systemTab = 'overview'; render(); window.scrollTo({top:0,behavior:'instant'}); return; }
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id;

  switch(act){
    case 'page': STATE.page = id; render(); window.scrollTo({top:0,behavior:'instant'}); break;
    case 'open-system':
      STATE.selectedSystem = id; STATE.systemTab = 'overview'; STATE.page = 'system'; render(); window.scrollTo({top:0,behavior:'instant'}); break;
    case 'open-estate': STATE.page = 'estate'; render(); break;
    case 'open-lab': STATE.page = 'lab'; if(id) STATE.selectedScenario = id; STATE.simValue = null; render(); window.scrollTo({top:0,behavior:'instant'}); break;
    case 'open-controls': STATE.page = 'controls'; render(); break;
    case 'open-monitor': STATE.page = 'monitor'; render(); break;
    case 'open-assurance': STATE.page = 'assurance'; render(); break;
    case 'workflow': STATE.selectedWorkflow = id; render(); break;
    case 'system-tab': STATE.systemTab = id; render(); break;
    case 'scenario': STATE.selectedScenario = id; STATE.simValue = null; render(); break;
    case 'control-group': STATE.controlGroup = id; render(); break;
    case 'run': runScenario(); break;
    case 'pause':
      STATE.paused[id] = !STATE.paused[id];
      const s = sys(id);
      addEvent({ title:(STATE.paused[id]?'Local fixture dispatch paused':'Local fixture dispatch resumed') + ' — ' + s.name, desc:'Local agent gateway mode changed. No PLC or equipment affected.', system:s.name, systemId:id, decision:STATE.paused[id]?'PAUSED':'RESUMED', effect:'NONE', status:'info' });

    case 'open-review': openReview(id); break;
    case 'decide': decide(id, btn.dataset.verdict); break;
    case 'close-modal': closeModal(); break;
    case 'dismiss-judge': STATE.judgeGuidance = false; render(); break;
    case 'start-demo':

    case 'export-ledger': exportLedger(); break;

});

 const authorityVerdict=st.iam ? (explicitMismatch?'REQUEST_OUTSIDE_DELEGATION':'APPROVED_FIXTURE_SCOPE') : 'EFFECTIVE_GRANT_UNKNOWN';
 const proof=st.witness ? (executed?'FIXTURE_TARGET_READBACK_APPLIED':'FIXTURE_GATE_DENIAL_RECEIPT') : 'NO_INDEPENDENT_EFFECT_WITNESS';
 const title=blocked?'Local gate blocks the consequential operation':pending?'Local gate holds for trusted evidence / human review':executed?'Unsafe business effect possible in this fixture':'Outcome not established';
 const summary=blocked?`The requested ${x.action} is outside the approved action scope. The local deterministic gate denies dispatch; the fixture business system is unchanged.`:
 pending?'The test policy permits the operation conditionally, but a qualified grant and an authorized human decision are still required. No effect applied.':
 executed?`This run demonstrates the exposure: ${!st.gate?'no enforcement boundary was connected':'a deliberately broad fixture policy was approved'}. The fixture applies the consequential effect; HAIEC finding alone would not prevent it.`:
 'No conclusive effect claim is available.';
 return {localDecision,authorityVerdict,proof,executed,blocked,pending,title,summary,explicitMismatch,gate:st.gate,qual:st.iam,observed:st.witness};
}
